name: retryrail

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retryrail}
      POSTGRES_USER: ${POSTGRES_USER:-retryrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retryrail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      RETRYRAIL_ENVIRONMENT: development
      RETRYRAIL_DATABASE_URL: postgresql+psycopg://retryrail:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/${POSTGRES_DB:-retryrail}
      RETRYRAIL_MERCHANT_ID: ${RETRYRAIL_MERCHANT_ID:-merchant_synthetic_001}
      RETRYRAIL_WEBHOOK_SECRET: ${RETRYRAIL_WEBHOOK_SECRET:-replace-with-a-random-local-test-secret}
      RETRYRAIL_MERCHANT_APPROVAL_SECRET: ${RETRYRAIL_MERCHANT_APPROVAL_SECRET:-replace-with-a-random-local-approval-secret}
      RETRYRAIL_APPROVAL_TOKEN_HMAC_KEY: ${RETRYRAIL_APPROVAL_TOKEN_HMAC_KEY:-replace-with-a-random-local-token-hmac-key}
      RETRYRAIL_MERCHANT_APPROVER_ID: ${RETRYRAIL_MERCHANT_APPROVER_ID:-merchant_operator_local}
      RETRYRAIL_RECOVERY_MODE: ${RETRYRAIL_RECOVERY_MODE:-review_first}
      RETRYRAIL_RECOVERY_TEMPLATE_ENABLED: ${RETRYRAIL_RECOVERY_TEMPLATE_ENABLED:-true}
      RETRYRAIL_RECOVERY_KILL_SWITCH: ${RETRYRAIL_RECOVERY_KILL_SWITCH:-false}
      RETRYRAIL_RECOVERY_EXECUTION_TARGET: ${RETRYRAIL_RECOVERY_EXECUTION_TARGET:-deterministic_fake}
      RETRYRAIL_RAZORPAY_KEY_ID: ${RETRYRAIL_RAZORPAY_KEY_ID:-}
      RETRYRAIL_RAZORPAY_KEY_SECRET: ${RETRYRAIL_RAZORPAY_KEY_SECRET:-}
      RETRYRAIL_RAZORPAY_CONNECT_TIMEOUT_SECONDS: ${RETRYRAIL_RAZORPAY_CONNECT_TIMEOUT_SECONDS:-3}
      RETRYRAIL_RAZORPAY_READ_TIMEOUT_SECONDS: ${RETRYRAIL_RAZORPAY_READ_TIMEOUT_SECONDS:-8}
      RETRYRAIL_REPLAY_ENABLED: ${RETRYRAIL_REPLAY_ENABLED:-false}
      RETRYRAIL_REPLAY_TOKEN: ${RETRYRAIL_REPLAY_TOKEN:-replace-with-a-random-local-replay-token}
      RETRYRAIL_CORS_ORIGINS: '["http://localhost:5173"]'
    command: ["uvicorn", "retryrail.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      RETRYRAIL_ENVIRONMENT: development
      RETRYRAIL_DATABASE_URL: postgresql+psycopg://retryrail:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/${POSTGRES_DB:-retryrail}
      RETRYRAIL_MERCHANT_ID: ${RETRYRAIL_MERCHANT_ID:-merchant_synthetic_001}
      RETRYRAIL_WEBHOOK_SECRET: ${RETRYRAIL_WEBHOOK_SECRET:-replace-with-a-random-local-test-secret}
      RETRYRAIL_WORKER_METRICS_HOST: 0.0.0.0
      RETRYRAIL_WORKER_METRICS_PORT: 9101
    command: ["python", "-m", "retryrail.worker"]
    expose:
      - "9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      RETRYRAIL_ENVIRONMENT: development
      RETRYRAIL_DATABASE_URL: postgresql+psycopg://retryrail:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/${POSTGRES_DB:-retryrail}
      RETRYRAIL_WEBHOOK_SECRET: ${RETRYRAIL_WEBHOOK_SECRET:-replace-with-a-random-local-test-secret}
    command: ["retryrail-db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: ["pnpm", "--filter", "@retryrail/web", "dev", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.5@sha256:540bbdc8c081f679c6b01b203c8824c9c12bb324fc22ad5d71768c8b717a00e4
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - retryrail-prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.0@sha256:95a8098fb092130e111b0264a9be4d3a2bd5405e5dba88d4b8f1f630b389614e
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - retryrail-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  retryrail-postgres:
  retryrail-prometheus:
  retryrail-grafana:
